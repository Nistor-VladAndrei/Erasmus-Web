version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fratii-buzesti-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fratii_buzesti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fratii-buzesti-backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=fratii_buzesti
      - JWT_SECRET=dd78f0b8838262efe46967704cd3ed77
      - PORT=3001
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge